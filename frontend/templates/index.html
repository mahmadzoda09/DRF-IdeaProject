{% load static %}<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Авиценна</title>
  <link rel="icon" type="image/svg+xml" href="{% static 'img/logo.svg' %}?v={{ v }}">
  <script>
    // Тема ставится до отрисовки, чтобы не было вспышки светлой темы
    (function () {
      var theme;
      try { theme = localStorage.getItem("theme"); } catch (e) {}
      if (theme !== "light" && theme !== "dark") {
        theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=block">
  <link rel="stylesheet" href="{% static 'css/app.css' %}?v={{ v }}">
</head>
<body>
  <!-- Экран входа -->
  <section id="login-screen" class="login hidden">
    <form id="login-form" class="card login-card">
      <div class="login-head">
        <div class="brand-block">
          <img class="brand-icon" src="{% static 'img/logo.svg' %}?v={{ v }}" alt="">
          <div class="brand-text">
            <h1 class="brand-name" data-i18n="brand">Авиценна</h1>
            <span class="brand-sub" data-i18n="brand.country">Управление аптекой</span>
          </div>
        </div>
        <button type="button" class="icon-btn theme-toggle" data-i18n-title="theme.toggle"><span class="ms theme-icon"></span></button>
      </div>
      <div class="lang-switch"></div>
      <p class="muted" data-i18n="login.subtitle">Войдите, чтобы продолжить</p>
      <label><span data-i18n="login.username">Логин</span><input name="username" autocomplete="username" required></label>
      <label><span data-i18n="login.password">Пароль</span><input name="password" type="password" autocomplete="current-password" required></label>
      <div class="error" id="login-error"></div>
      <button class="btn primary" type="submit" data-i18n="login.submit">Войти</button>
    </form>
  </section>

  <!-- Приложение -->
  <div id="app" class="layout hidden">
    <aside class="sidebar">
      <div>
        <div class="brand">
          <img class="brand-icon" src="{% static 'img/logo.svg' %}?v={{ v }}" alt="">
          <div class="brand-text">
            <span class="brand-name" data-i18n="brand">Авиценна</span>
            <span class="brand-sub" data-i18n="brand.country">Управление аптекой</span>
          </div>
          <button type="button" class="icon-btn sidebar-close" id="sidebar-close" data-i18n-title="back"><span class="ms">arrow_back</span></button>
        </div>
        <nav id="nav"></nav>
      </div>
      <div class="sidebar-footer">
        <div class="lang-switch"></div>
        <a id="me" class="me" href="#/profile"></a>
      </div>
    </aside>
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

    <header class="topbar">
      <div class="topbar-left">
        <button type="button" class="icon-btn menu-btn" id="menu-btn"><span class="ms">menu</span></button>
        <span class="chip"><span class="ms">calendar_today</span><span id="today"></span></span>
      </div>
      <div class="topbar-right">
        <button type="button" class="icon-btn theme-toggle" data-i18n-title="theme.toggle"><span class="ms theme-icon"></span></button>
        <div class="divider"></div>
        <a id="topbar-user" class="topbar-user" href="#/profile" data-i18n-title="nav.profile"></a>
        <button type="button" class="logout" id="logout" data-i18n-title="logout"><span class="ms">logout</span><span class="logout-label" data-i18n="logout">Выйти</span></button>
      </div>
    </header>

    <main class="content">
      <div class="page">
        <div class="page-head">
          <div class="page-heading">
            <div class="eyebrow" id="page-eyebrow"></div>
            <h1 id="page-title"></h1>
            <p class="muted" id="page-subtitle"></p>
          </div>
          <div id="page-actions"></div>
        </div>
        <div id="view"></div>
      </div>
    </main>

    <!-- ИИ-ассистент: кнопка в правом нижнем углу и окно чата (наполняет app.js) -->
    <button type="button" id="ai-fab" class="ai-fab"><span class="ms ai-fab-open">smart_toy</span><span class="ms ai-fab-close">close</span></button>
    <section id="ai-panel" class="ai-panel hidden" role="dialog" aria-modal="false"></section>
  </div>

  <!-- Модальное окно -->
  <div id="modal" class="modal hidden">
    <div class="modal-box card">
      <div class="modal-head">
        <h3 id="modal-title"></h3>
        <button type="button" class="icon-btn" data-close><span class="ms">close</span></button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="{% static 'js/i18n.js' %}?v={{ v }}"></script>
  <script src="{% static 'js/api.js' %}?v={{ v }}"></script>
  <script src="{% static 'js/app.js' %}?v={{ v }}"></script>
</body>
</html>
