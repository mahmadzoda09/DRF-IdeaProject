# nginx сервера (не в Docker): домен savdo.softclub.tj → контейнер frontend (127.0.0.1:8080).
# Установка:
#   sudo cp deploy/nginx-savdo.softclub.tj.conf /etc/nginx/sites-available/savdo.softclub.tj
#   sudo ln -s /etc/nginx/sites-available/savdo.softclub.tj /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d savdo.softclub.tj      # https (certbot сам допишет блок 443)
#
# Домен за Cloudflare: https браузеру даёт Cloudflare. SSL/TLS в Cloudflare:
#   «Full» — после certbot (рекомендуется); «Flexible» — без certbot, до сервера по http.

map $http_upgrade $savdo_connection {
    default upgrade;
    ""      close;
}
# за Cloudflare настоящий протокол пользователя — в его заголовке X-Forwarded-Proto
map $http_x_forwarded_proto $savdo_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name savdo.softclub.tj;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $savdo_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $savdo_proto;
        proxy_read_timeout 1h;  # WebSocket чата
    }
}
