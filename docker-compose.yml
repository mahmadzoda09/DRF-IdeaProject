# Весь проект: docker compose up -d --build
#   frontend       — nginx сайта, единственный, кто смотрит наружу (порт FRONTEND_PORT, по умолчанию 8080)
#   backend-nginx  — nginx бэкенда: /media, статика Django, прокси в daphne
#   backend        — Django + DRF + WebSocket-чат (daphne)
#   redis          — рассылка сообщений чата
# Настройки — в .env (пример: .env.example)

services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DJANGO_DB_PATH: /app/data/db.sqlite3
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_STATIC_ROOT: /app/staticfiles
      DJANGO_STATIC_URL: /django-static/
      REDIS_URL: redis://redis:6379/0
    volumes:
      - db:/app/data
      - media:/app/media
      - static:/app/staticfiles
    depends_on:
      - redis

  backend-nginx:
    image: nginx:1.29-alpine
    restart: unless-stopped
    volumes:
      - ./docker/backend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - media:/app/media:ro
      - static:/app/staticfiles:ro
    depends_on:
      - backend

  frontend:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend-nginx

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis:/data

volumes:
  db:
  media:
  static:
  redis:
