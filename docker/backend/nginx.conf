# nginx бэкенда: сам отдаёт загруженные файлы и статику Django, остальное — в daphne (API, Swagger, WebSocket)

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
# https приходит от внешнего nginx — передаём дальше как есть
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream daphne {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 30m;  # видео в чате до 25 МБ

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location /django-static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    location / {
        proxy_pass http://daphne;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;  # WebSocket чата держится открытым
    }
}
