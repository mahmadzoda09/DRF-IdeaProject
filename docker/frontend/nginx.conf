# nginx фронтенда: сайт (одна страница) + всё серверное — в nginx бэкенда.
# Для браузера это один адрес, поэтому фронтенд работает без изменений и без CORS.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream backend_nginx {
    server backend-nginx:80;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    client_max_body_size 30m;

    # страница приложения — всегда свежая (в ней ссылки с ?v= на новые css/js)
    location = / {
        add_header Cache-Control "no-cache";
        try_files /index.html =404;
    }

    location /static/ {
        expires 30d;
        try_files $uri =404;
    }

    # API и Swagger, WebSocket чата, загруженные файлы, админка Django и её статика
    location ~ ^/(api|ws|media|admin|django-static)(/|$) {
        proxy_pass http://backend_nginx;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h;
    }

    # всё остальное — на главную (адреса страниц у фронтенда после #)
    location / {
        return 302 /;
    }
}
